version: '3.8'

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raga-octi-api
    ports:
      - "1453:1453"
      - "9229:9229"  # Debug port
    volumes:
      - ./src:/app/src
      - ./node_modules:/app/node_modules
      # GGUF models for EMBEDDING_PROVIDER=llama / RERANK_ENABLED=true; harmless if unused.
      - ./models:/app/models:ro
    # Picks up everything from .env (auth keys, thresholds, upload limits, ...); the
    # environment block below only overrides values that must point at in-network hostnames.
    env_file:
      - .env
    environment:
      - PORT=1453
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - NODE_ENV=development
      - RAG_TOP_K=4
      # The app reads MAX_TOKENS (RAG_MAX_TOKENS was ignored).
      - MAX_TOKENS=200
      # The ollama service below is on the same compose network.
      - OLLAMA_HOST=http://ollama:11434
    command: npm run dev -- --inspect=0.0.0.0:9229
    depends_on:
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  chromadb-data:
  ollama-data:
