version: '3.8'

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - app-network
    # chromadb/chroma ships no curl/wget/python, so the healthcheck talks HTTP directly over
    # a bash /dev/tcp socket instead of shelling out to a tool the image doesn't have.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q '200 OK'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: groundwire-api
    ports:
      - "3000:3000"
    # Picks up everything from .env (auth keys, thresholds, upload limits, ...); the
    # environment block below only overrides the values that must point at in-network
    # hostnames instead of the localhost defaults used for a bare `npm run dev`.
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      # This API talks to Ollama for embeddings/generation. Point it at an Ollama reachable
      # from the container (a host install, or an ollama service). host.docker.internal
      # resolves to the host on Docker Desktop and on Podman Desktop/podman machine (gvproxy);
      # on rootless Podman on Linux use host.containers.internal instead.
      # Deliberately NOT ${OLLAMA_HOST:-...}: compose auto-loads the top-level .env for
      # variable substitution, and that file's OLLAMA_HOST is the host-side localhost value
      # (for a bare `npm run dev`), which would silently break in-container connectivity.
      - OLLAMA_HOST=http://host.docker.internal:11434
      # Async ingest queue (BullMQ + Redis). Uploaded files are staged on a volume the
      # worker reads from; keep it on shared storage if you scale to multiple instances.
      - REDIS_URL=redis://redis:6379
      - UPLOAD_DIR=/app/uploads
    volumes:
      - upload-data:/app/uploads
      # GGUF models for EMBEDDING_PROVIDER=llama / RERANK_ENABLED=true; harmless if unused.
      - ./models:/app/models:ro
    depends_on:
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - app-network
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      # Change on a real deployment; fine for local monitoring. Anonymous access stays off.
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - app-network
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  chromadb-data:
  redis-data:
  upload-data:
  prometheus-data:
  grafana-data:
